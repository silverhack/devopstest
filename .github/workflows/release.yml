name: Create Release

on:
  push:
    branches:
      - main
jobs:
  monkeyversion:
    name: Get Monkey365 version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Get current version
        id: monkey365version
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest -Path "./src/monkey365/monkey365.psd1"
          $version = $manifest.Version.ToString()
          $prerelease = [string]$manifest.PrivateData.PSData['Prerelease']
          If (-not [string]::IsNullOrWhiteSpace($prerelease)) {
              $separator = If ($prerelease.StartsWith('-')) { '' } Else { '-' }
              $version = ("{0}{1}{2}" -f $version, $separator, $prerelease)
          }
          $releaseName = ("Monkey365 v{0}" -f $version)
          "monkey365version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "releasename=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Get current date
        id: date
        run: echo "today=$(date +'%Y-%m-%d_%H%M%S')" >> $GITHUB_OUTPUT
      - name: Check for existing release
        id: check_release
        shell: bash
        run: |
          if release_details=$(gh release view "$RELEASE_TAG" --json tagName,name --jq '[.tagName, .name] | @tsv' 2>/dev/null); then
            IFS=$'\t' read -r existing_tag existing_name <<< "$release_details"
            if [[ "$existing_tag" != "$RELEASE_TAG" || "$existing_name" != "$RELEASE_NAME" ]]; then
              echo "::error::Release tag '$RELEASE_TAG' already exists with the name '$existing_name'; expected '$RELEASE_NAME'."
              exit 1
            fi

            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release '$RELEASE_NAME' with tag '$RELEASE_TAG' already exists; only its artifacts will be updated."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "Release '$RELEASE_NAME' with tag '$RELEASE_TAG' does not exist and will be created."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.monkey365version.outputs.monkey365version }}
          RELEASE_NAME: ${{ steps.monkey365version.outputs.releasename }}
      - name: Create Release
        id: create_release
        if: steps.check_release.outputs.release_exists != 'true'
        run: >-
          gh release create "$RELEASE_TAG"
          --title "$RELEASE_NAME"
          --notes "$RELEASE_NOTES"
          --target "$GITHUB_SHA"
          --draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.monkey365version.outputs.monkey365version }}
          RELEASE_NAME: ${{ steps.monkey365version.outputs.releasename }}
          RELEASE_NOTES: Thanks for following [Monkey365](https://github.com/silverhack/monkey365)!
      # Create a zip of the folder
      - name: Create ZIP file of the folder
        if: steps.check_release.outputs.release_exists == 'true' || steps.create_release.outcome == 'success'
        run: |
          mkdir -p build
          git archive --format zip --prefix monkey365/ --add-file=LICENSE --output ./build/monkey365.zip main:src/monkey365
          gh release upload "$RELEASE_TAG" ./build/monkey365.zip --clobber
          sha256sum ./build/monkey365.zip | awk '{print $1}' > ./build/monkey365.zip.sha256
          gh release upload "$RELEASE_TAG" ./build/monkey365.zip.sha256 --clobber
          sha512sum ./build/monkey365.zip | awk '{print $1}' > ./build/monkey365.zip.sha512
          gh release upload "$RELEASE_TAG" ./build/monkey365.zip.sha512 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.monkey365version.outputs.monkey365version }}
